name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build JAR and Tar Deployment Files
        run: ./gradlew build jibBuildTar -x test

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: |
            이 릴리즈는 새로운 버전의 독립형 배포 파일(JAR 및 Docker Tar)을 포함합니다.

            해당 버전에 적용된 커밋 및 PR 내역은 아래 생성된 변경 로그를 참조하세요.
          files: |
            build/libs/*.jar
            build/jib-image.tar
          generate_release_notes: true
