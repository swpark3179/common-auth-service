spring:
  application:
    name: idp-auth-service
  threads:
    virtual:
      enabled: true   # Java 21 Virtual Thread
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false    # prod 프로파일에서만 활성화

server:
  port: 8080

# JWT 설정 (환경변수로 주입 권장)
jwt:
  secret: ${JWT_SECRET:defaultDevSecretKeyMustBeAtLeast32CharsLong}
  access-token-expiry: ${JWT_ACCESS_EXPIRY:1800}    # 30분
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800} # 7일

# 감사 로그 전용 비동기 스레드풀
audit:
  executor:
    core-pool-size: 2
    max-pool-size: 10
    queue-capacity: 500

logging:
  level:
    com.idp: INFO
    org.springframework.security: INFO
